<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood Landscape</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A7F7B">
</head>
<body>
<main>
  <h1>Mood Landscape</h1>
  <p class="sub">Type how you feel, or move the sliders. The scene changes with you: stormy to sunny, still to restless, night to day.</p>
  <canvas id="cv" role="img" aria-label="A generated landscape that reflects the chosen mood"></canvas>
  <p class="cap" id="cap" aria-live="polite"></p>

  <section class="panel">
    <div class="row">
      <input type="text" id="feel" placeholder="e.g. tired but hopeful, or not okay" aria-label="How are you feeling?" maxlength="80" autocomplete="off">
    </div>
    <div class="row" id="chips"></div>
    <div class="row">
      <label>Mood <input type="range" id="m" min="0" max="100" value="70"></label>
      <label>Energy <input type="range" id="e" min="0" max="100" value="40"></label>
      <label>Time <input type="range" id="t" min="0" max="100" value="80"></label>
    </div>
    <div class="row">
      <button id="shape" class="primary">New landscape</button>
      <button id="keep">Save moment</button>
      <button id="pause" aria-pressed="false">Pause</button>
      <button id="share">Copy link</button>
      <button id="save">Save PNG</button>
    </div>
  </section>

  <section class="panel">
    <h2>Mood journal</h2>
    <div class="row" id="journal"></div>
  </section>
</main>

<script src="words.js"></script>
<script src="script.js"></script>
<script src="sound.js"></script>
<script src="pwa.js"></script>
</body>
</html>
